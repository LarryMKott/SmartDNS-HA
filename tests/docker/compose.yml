services:
  node1:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
    hostname: node1
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BROADCAST
    sysctls:
      net.ipv4.ip_nonlocal_bind: "1"
    networks:
      dnsha:
        ipv4_address: 172.28.0.11

  node2:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
    hostname: node2
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BROADCAST
    sysctls:
      net.ipv4.ip_nonlocal_bind: "1"
    networks:
      dnsha:
        ipv4_address: 172.28.0.12

networks:
  dnsha:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
